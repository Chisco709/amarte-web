<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Panel · Fundación Amarte</title>
<style>body{font:17px/1.5 system-ui,sans-serif;max-width:680px;margin:0 auto;padding:24px;background:#f6f4ee;color:#0a2e0e}h1{font-size:30px}
textarea,input,select{width:100%;font:inherit;padding:10px;border:3px solid #0a2e0e;border-radius:0;background:#fff;margin:4px 0 14px}
button{font:800 17px system-ui;background:#f0b232;border:3px solid #0a2e0e;padding:12px 20px;cursor:pointer;box-shadow:4px 4px 0 #0a2e0e}
pre{background:#0a2e0e;color:#fff;padding:16px;white-space:pre-wrap;word-break:break-word}</style></head><body>
<h1>Panel de la fundación</h1>
<p>Pega aquí el mensaje de WhatsApp que recibiste. Te devuelvo la línea lista para pegar en <b>js/data.js</b>. Esta página no guarda nada.</p>
<label>Mensaje recibido<textarea id="m" rows="6"></textarea></label>
<label>¿Qué hacer con esta solicitud?<select id="e"><option value="p">Reservar mientras pagan (en proceso)</option><option value="a">Ya pagó: marcar como apadrinado</option></select></label>
<label id="hl">Reservar por cuántos días<input id="d" type="number" value="2" min="1" max="30"></label>
<button id="go">Generar línea</button>
<h2>Pega esto en <span id="w">EN_PROCESO</span></h2><pre id="o">…</pre><button id="cp">Copiar</button>
<script>
var $=function(i){return document.getElementById(i)};
$('e').onchange=function(){var p=$('e').value=='p';$('hl').style.display=p?'':'none';$('w').textContent=p?'EN_PROCESO':'APADRINADOS'};
$('go').onclick=function(){var t=$('m').value,hx=(t.match(/Hex[aá]gonos?:\s*(.*)/i)||[,''])[1].match(/\d+/g)||[],nm=((t.match(/Nombre:\s*(.*)/i)||[,''])[1]).trim(),mo=(t.match(/Mostrar nombre:\s*(\S+)/i)||[,'s'])[1].toLowerCase();
if(!hx.length){$('o').textContent='No encontré los números de hexágono en el mensaje.';return}
if(mo=='no')nm='Anónimo';nm=nm.replace(/'/g,"\\'");var l="{ hex: ["+hx.join(', ')+"]";
if($('e').value=='p'){var d=new Date(Date.now()+(+$('d').value)*864e5),s=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');l+=", hasta: '"+s+"' },"}
else l+=", nombre: '"+nm+"' },";$('o').textContent=l};
$('cp').onclick=function(){navigator.clipboard.writeText($('o').textContent);$('cp').textContent='¡Copiado!'};
</script></body></html>
